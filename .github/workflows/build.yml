name: Build

on:
  push:
  pull_request:

# Read-only token: the job runs repository build scripts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Test script and data tooling
        run: |
          python3 tools/test_flw0.py
          python3 tools/test_inf.py
          python3 tools/test_wap.py
          python3 tools/test_fld.py
          python3 tools/test_battle_tbl.py
          python3 tools/test_dev_elf.py

      # The retail executables are not in this repository. CI reads them from a
      # private repository with a read-only deploy key (secret ORIG_DEPLOY_KEY).
      # Pull requests from forks get no secrets and skip the build.
      - name: Check for retail executables
        id: orig
        env:
          KEY: ${{ secrets.ORIG_DEPLOY_KEY }}
        run: echo "available=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Fetch retail executables
        if: steps.orig.outputs.available == 'true'
        uses: actions/checkout@v5
        with:
          repository: Raikaru/dds-decomp-orig
          ssh-key: ${{ secrets.ORIG_DEPLOY_KEY }}
          path: .orig-src
          persist-credentials: false

      - name: Install dependencies
        if: steps.orig.outputs.available == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build cpp
          python3 -m pip install -q -r requirements.txt
          python3 tools/download_tools.py
          mkdir -p orig/dds1 orig/dds2
          cp .orig-src/orig/dds1/SLUS_209.74 orig/dds1/
          cp .orig-src/orig/dds2/SLUS_211.52 orig/dds2/
          rm -rf .orig-src

      - name: Configure
        if: steps.orig.outputs.available == 'true'
        run: python3 configure.py dds1 dds2

      # Fails unless both executables are byte-identical to retail.
      - name: Build
        if: steps.orig.outputs.available == 'true'
        run: ninja dds1 dds2 dds1-dev

      - name: Progress reports
        if: steps.orig.outputs.available == 'true'
        run: |
          ninja build/dds1/report.json build/dds2/report.json
          python3 tools/progress.py

      # decomp.dev reads one artifact per version, named <version>_report.
      - name: Upload dds1 report
        if: steps.orig.outputs.available == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: dds1_report
          path: build/dds1/report.json

      - name: Upload dds2 report
        if: steps.orig.outputs.available == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: dds2_report
          path: build/dds2/report.json
