name: Build

on:
  push:
  pull_request:

# Read-only token: the job runs repository build scripts.
permissions:
  contents: read

# A new push to a branch supersedes the one still running on it. Runs on main
# are left alone: each commit's report artifacts are published from its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Test script and data tooling
        run: python3 tools/run_tests.py

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The retail executables are not in this repository. CI reads them from a
      # private repository with a read-only deploy key (secret ORIG_DEPLOY_KEY).
      # Pull requests from forks get no secrets and skip the build.
      - name: Check for retail executables
        id: orig
        env:
          KEY: ${{ secrets.ORIG_DEPLOY_KEY }}
        run: echo "available=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Fetch retail executables
        if: steps.orig.outputs.available == 'true'
        uses: actions/checkout@v5
        with:
          repository: Raikaru/dds-decomp-orig
          ssh-key: ${{ secrets.ORIG_DEPLOY_KEY }}
          path: .orig-src
          persist-credentials: false

      # The compiler, binutils, objdiff and glibc are all pinned URLs.
      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin
            tools/compilers
            tools/glibc32
          key: tools-${{ hashFiles('tools/download_tools.py', 'tools/ee_as_relax.py', 'tools/ee_gcc_aslr.py') }}

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build cpp
          python3 -m pip install -q -r requirements.txt
          python3 tools/download_tools.py

      - name: Prepare retail inputs
        if: steps.orig.outputs.available == 'true'
        run: |
          mkdir -p orig/dds1 orig/dds2
          cp .orig-src/orig/dds1/SLUS_209.74 orig/dds1/
          cp .orig-src/orig/dds2/SLUS_211.52 orig/dds2/
          rm -rf .orig-src

      - name: Compile non-matching C
        run: python3 tools/check_nonmatching.py

      - name: Configure
        if: steps.orig.outputs.available == 'true'
        run: python3 configure.py dds1 dds2

      # Fails unless both executables are byte-identical to retail.
      - name: Build
        if: steps.orig.outputs.available == 'true'
        run: ninja dds1 dds2 dds1-dev dds2-dev

      - name: Progress reports
        if: steps.orig.outputs.available == 'true'
        run: |
          ninja build/dds1/report.json build/dds2/report.json build/dds1/report.all.json build/dds2/report.all.json
          python3 tools/progress.py

      - name: Check report scope
        if: steps.orig.outputs.available == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for version in ("dds1", "dds2"):
              root = Path("build") / version
              primary = json.loads((root / "report.json").read_text())
              audit = json.loads((root / "report.all.json").read_text())
              game_units = [unit for unit in audit["units"]
                            if "game" in unit.get("metadata", {}).get("progress_categories", [])]
              game_measures = next(category["measures"] for category in audit["categories"]
                                   if category["id"] == "game")
              assert primary["units"] == game_units, f"{version}: primary game units changed"
              assert primary["measures"] == game_measures, f"{version}: primary game totals changed"
              print(f"{version}: primary report equals full-binary audit's game scope")
          PY

      # decomp.dev reads the game-code reports, named <version>_report.
      - name: Upload dds1 report
        if: steps.orig.outputs.available == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: dds1_report
          path: build/dds1/report.json

      - name: Upload dds2 report
        if: steps.orig.outputs.available == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: dds2_report
          path: build/dds2/report.json

      # Keep SDK/VU1/game totals auditable without importing extra site versions.
      # This name intentionally does not match decomp.dev's *_report pattern.
      - name: Upload full-binary audit
        if: steps.orig.outputs.available == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: build-audit
          path: |
            build/dds1/report.all.json
            build/dds2/report.all.json
            build/dds1/report.json.raw
            build/dds2/report.json.raw
            build/dds1/report.all.json.raw
            build/dds2/report.all.json.raw
            build/dds1/report.json.proof.json
            build/dds2/report.json.proof.json
            build/dds1/report.all.json.proof.json
            build/dds2/report.all.json.proof.json
